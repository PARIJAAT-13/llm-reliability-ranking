services:
  llm-reliability:
    build: .
    image: llm-reliability-ranking:latest
    container_name: llm-reliability
    restart: unless-stopped
    entrypoint: ["python", "-m", "llm_reliability"]
    volumes:
      - ./results:/app/results
      - ./configs:/app/configs:ro
      - ./.cache:/app/.cache
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: ["--help"]
    healthcheck:
      test: ["CMD", "python", "-c", "import llm_reliability; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
