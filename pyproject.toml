[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-reliability-ranking"
version = "2.0.0"
description = "Research framework for comparing success-based and reliability-based LLM agent rankings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["LLM", "reliability", "ranking", "evaluation", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "scipy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/PARIJAAT-13/llm-reliability-ranking"
Repository = "https://github.com/PARIJAAT-13/llm-reliability-ranking"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
visualization = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
]
providers = [
    "openai>=1.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.5.0",
    "huggingface_hub>=0.20.0",
    "groq>=0.5.0",
    "cohere>=5.0.0",
    "mistralai>=1.0.0",
    "boto3>=1.28.0",
    "google-cloud-aiplatform>=1.38.0",
    "vertexai>=1.38.0",
    "litellm>=1.0.0",
]
providers = [
    "openai>=1.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.5.0",
    "huggingface_hub>=0.20.0",
    "groq>=0.5.0",
    "cohere>=5.0.0",
    "mistralai>=1.0.0",
    "boto3>=1.28.0",
    "google-cloud-aiplatform>=1.38.0",
    "litellm>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
llm-reliability = "llm_reliability.orchestration.experiment_orchestrator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "N", "UP"]
ignore = [
    "E501",
    "N802",
    "N803",
    "N806",
    "N815",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "S101", "N814"]
"scripts/*" = ["E402"]
"src/llm_reliability/benchmarks/adapters/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = false
follow_imports = "skip"
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
disable_error_code = ["import-untyped", "import-not-found"]

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "seaborn.*",
    "numpy.*",
    "openai.*",
    "anthropic.*",
    "google.*",
    "huggingface_hub.*",
    "llama_cpp.*",
    "jinja2.*",
    "openpyxl.*",
    "pandas.*",
    "scipy.*",
    "yaml.*",
]
ignore_missing_imports = true
