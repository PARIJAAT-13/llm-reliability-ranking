# Example Declarative Experiment Matrix Configuration (YAML)
name: "international_conference_pilot_study"
output_dir: "results"

models:
  - MockAgent
  - GPT-4.1
  - Claude
  - Gemini
  - Qwen
  - DeepSeek

benchmarks:
  - MockBenchmark
  - AgentBoard
  - GAIA
  - SWE-bench Lite

seeds:
  - 1
  - 2
  - 3
  - 4
  - 5

repetitions: 10
perturbations:
  - typo
  - prompt_injection
fault_injection: false
parallel: false
max_workers: 4
matrix_mode: "per_pair"
